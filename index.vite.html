<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Phone often opens /ssn-info- (no slash) → assets 404. Force trailing slash + hash route.
      (function () {
        var p = location.pathname
        if (p === '/ssn-info-') {
          location.replace('/ssn-info-/' + location.search + (location.hash || '#/'))
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a32" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SSN INFO AND ENTERPRISES — Premium Billing</title>
    <style>
      html, body { margin: 0; background: #e8eef2; }
      #boot-fallback {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        font-family: system-ui, sans-serif;
        text-align: center;
        color: #12202a;
      }
      #boot-fallback h1 { font-size: 1.25rem; margin: 0 0 8px; }
      #boot-fallback p { color: #5a6b76; margin: 0 0 16px; line-height: 1.4; }
      #boot-fallback a, #boot-fallback button {
        display: inline-block;
        margin: 4px;
        padding: 12px 16px;
        border-radius: 10px;
        border: 0;
        background: #0d5c63;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div>
          <h1>SSN INFO AND ENTERPRISES</h1>
          <p id="boot-msg">Loading billing app…</p>
          <button type="button" onclick="location.reload()">Reload</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      setTimeout(function () {
        if (!window.__SSN_READY) {
          var msg = document.getElementById('boot-msg')
          if (msg) {
            msg.innerHTML =
              'Phone browser block panrathu. <b>Chrome</b>-la open pannunga:<br/>https://mohanrajcyber.github.io/ssn-info-/#/'
          }
        }
      }, 9000)
    </script>
  </body>
</html>
